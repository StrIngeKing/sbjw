# sbjw (Cyber Internal Affairs / 赛博纪委) bundle patch.
#
# A bundle patch is applied as one insert over the previous layer. The public
# component id is `sbjw`, matching the npm package name and DSH plugin page. Disable it there, or remove the bundle from `dsh.profile.bundles`,
# rather than editing this file.
#
# The guard has no required ordering beyond the rows it depends on
# (`dsh-tools` for the pipeline, `dsh-system-prompt` for the policy section,
# `dsh-agent-loop` for the turn it corrects). It declares those through
# `inject`, which keeps activation service-availability driven: a profile
# without one of them simply never activates the guard.
- insert:
    - id: sbjw
      name: sbjw
      config:
        mode: balanced
        prompt:
          enabled: true
          verbosity: minimal
        review:
          enabled: true
          highRiskOnly: true
          maxRounds: 1
        completionGate:
          enabled: true
          maxInjectionsPerTurn: 1
        freshnessGate:
          enabled: true
        evidence:
          injectDigest: false
        diagnostics:
          enabled: true
          includeSensitiveContent: false
          runtimeShellTrace: false
